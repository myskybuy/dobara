services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dobara
    volumes:
      - db_data:/var/lib/postgresql/data
      # Restored automatically the first time only (while db_data is empty).
      - ./docker/dobara.sql:/docker-entrypoint-initdb.d/01-dobara.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dobara"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dobara?schema=public
      APP_URL: http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
